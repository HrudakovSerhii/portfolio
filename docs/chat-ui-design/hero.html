<!DOCTYPE html>

<html class="dark" lang="en"><head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Welcome - Alex Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#137fec",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"],
            "body": ["Noto Sans", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
        },
      },
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-x-hidden min-h-screen flex flex-col">
<div class="layout-container flex h-full grow flex-col relative z-10">
  <!-- Background decorative gradient -->
  <div class="fixed inset-0 z-0 pointer-events-none opacity-20 dark:opacity-10" style="background: radial-gradient(circle at 50% 10%, #137fec 0%, transparent 40%);"></div>
  <!-- Header -->
  <header class="w-full flex justify-center py-4 px-4 sm:px-10 z-20">
    <div class="layout-content-container flex w-full max-w-[960px] items-center justify-between border-b border-solid border-slate-200 dark:border-[#233648] pb-4">
      <div class="flex items-center gap-3 text-slate-900 dark:text-white">
        <div class="size-8 flex items-center justify-center rounded-lg bg-primary/10 text-primary">
          <span class="material-symbols-outlined !text-2xl">smart_toy</span>
        </div>
        <h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">Alex.</h2>
      </div>
      <div class="flex items-center gap-4 sm:gap-8">
        <div class="hidden sm:flex items-center gap-6">
          <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Work</a>
          <a class="text-sm font-medium hover:text-primary transition-colors" href="#">About</a>
          <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Contact</a>
        </div>
        <button class="flex cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-5 bg-primary hover:bg-blue-600 transition-colors text-white text-sm font-bold tracking-[0.015em] shadow-lg shadow-blue-500/20">
          <span class="truncate">Resume</span>
        </button>
      </div>
    </div>
  </header>
  <!-- Main Content -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 py-10 z-20">
    <div class="layout-content-container flex flex-col items-center w-full max-w-[720px] gap-10">
      <!-- Profile & Greeting -->
      <div class="flex flex-col items-center gap-6 text-center animate-in fade-in zoom-in duration-500">
        <div class="relative group">
          <!-- Avatar glow effect -->
          <div class="absolute -inset-1 bg-gradient-to-r from-primary to-blue-400 rounded-full opacity-30 blur group-hover:opacity-50 transition duration-1000"></div>
          <div class="relative bg-center bg-no-repeat bg-cover rounded-full h-32 w-32 border-4 border-white dark:border-[#111a22]" data-alt="Professional portrait of a designer with a blurred modern office background" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDALkMWpEgepGqM47QUFyF3oDq7-B9a_FkAFi2IHTYo5hvboHxxw6L3V6FPgrcMSaJNx5_omzKMygJIDdQd7MNOEarXEOlr2tLZRt9DIqtjZvaDIVtPwt4dTYNUdie0ncVE1g37kxXc5C7ZwPb8MEK5Md66Z-D3rWcoU0SHDKgHf0WHngIR0-sr1zUh_ulca5wsmKEeQFExsAoLAEvipmEoefOZBs-enFOfJIxWKp5Jf1e14KfkdsSNYqUuF9XrRxL8zpv0yG1wOPxj");'>
          </div>
          <div class="absolute bottom-1 right-1 flex h-5 w-5 items-center justify-center rounded-full bg-[#101922] ring-2 ring-[#101922]">
            <div class="h-3 w-3 rounded-full bg-green-500 animate-pulse"></div>
          </div>
        </div>
        <div class="space-y-3 max-w-lg">
          <h1 class="text-4xl sm:text-5xl font-bold leading-tight tracking-tight">
            Hello, I'm <span class="text-primary">Alex</span>
          </h1>
          <p class="text-slate-500 dark:text-[#92adc9] text-lg sm:text-xl font-normal leading-relaxed">
            I design interfaces that speak human. <br class="hidden sm:block"/>Ready to start a new project?
          </p>
          <div class="flex items-center justify-center gap-2 pt-2">
<span class="inline-flex items-center rounded-full bg-green-500/10 px-2.5 py-0.5 text-xs font-medium text-green-500 ring-1 ring-inset ring-green-500/20">
                                ● Online &amp; Ready to Chat
                            </span>
          </div>
        </div>
      </div>
      <!-- Action Area -->
      <div class="w-full flex flex-col items-center gap-6">
        <!-- Main CTA -->
        <button class="group flex w-full max-w-[320px] cursor-pointer items-center justify-between rounded-full h-14 pl-6 pr-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-xl hover:scale-[1.02] transition-transform duration-200">
          <span class="text-lg font-bold">Start Conversation</span>
          <div class="h-10 w-10 flex items-center justify-center rounded-full bg-primary text-white group-hover:bg-blue-600 transition-colors">
            <span class="material-symbols-outlined">send</span>
          </div>
        </button>
        <!-- Quick Prompt Chips -->
        <div class="flex flex-wrap justify-center gap-3">
          <button class="flex h-9 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] px-4 hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20 dark:hover:text-primary transition-all cursor-pointer border border-transparent hover:border-primary/30">
            <span class="material-symbols-outlined !text-[18px]">palette</span>
            <span class="text-sm font-medium">Show me your best work</span>
          </button>
          <button class="flex h-9 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] px-4 hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20 dark:hover:text-primary transition-all cursor-pointer border border-transparent hover:border-primary/30">
            <span class="material-symbols-outlined !text-[18px]">terminal</span>
            <span class="text-sm font-medium">What is your tech stack?</span>
          </button>
          <button class="flex h-9 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] px-4 hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20 dark:hover:text-primary transition-all cursor-pointer border border-transparent hover:border-primary/30">
            <span class="material-symbols-outlined !text-[18px]">calendar_month</span>
            <span class="text-sm font-medium">Let's schedule a call</span>
          </button>
        </div>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <footer class="w-full flex justify-center py-8 z-20">
    <div class="layout-content-container flex flex-col items-center gap-6 px-5 text-center">
      <div class="flex flex-wrap justify-center gap-6">
        <a class="text-slate-400 hover:text-primary dark:text-[#92adc9] dark:hover:text-primary transition-colors" href="#">
          <span class="material-symbols-outlined">share</span>
        </a>
        <a class="text-slate-400 hover:text-primary dark:text-[#92adc9] dark:hover:text-primary transition-colors" href="#">
          <span class="material-symbols-outlined">mail</span>
        </a>
        <a class="text-slate-400 hover:text-primary dark:text-[#92adc9] dark:hover:text-primary transition-colors" href="#">
          <span class="material-symbols-outlined">code</span>
        </a>
      </div>
      <p class="text-slate-400 dark:text-[#92adc9] text-sm font-normal">© 2024 Alex Design. All rights reserved.</p>
    </div>
  </footer>
</div>
</body></html>
