<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Role Selection - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #101922;
        }
        ::-webkit-scrollbar-thumb {
            background: #233648;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #137fec;
        }

        /* Subtle fade-in animation for page load */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        /* Typing dot animation */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .typing-dot {
            animation: bounce 1s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.1s; }
        .typing-dot:nth-child(3) { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col overflow-x-hidden text-slate-900 dark:text-white transition-colors duration-200">
<!-- Top Navigation -->
<header class="w-full border-b border-gray-200 dark:border-[#233648] bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="size-8 rounded-lg bg-primary/20 flex items-center justify-center text-primary">
                <span class="material-symbols-outlined text-xl">terminal</span>
            </div>
            <span class="font-bold text-lg tracking-tight">Portfolio</span>
        </div>
        <nav class="hidden md:flex items-center gap-8">
            <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Home</a>
            <a class="text-sm font-medium hover:text-primary transition-colors" href="#">About</a>
            <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Projects</a>
            <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Contact</a>
        </nav>
        <div class="flex items-center gap-4">
            <button class="bg-primary hover:bg-blue-600 text-white text-sm font-bold px-5 h-10 rounded-full transition-all flex items-center gap-2 shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-[18px]">download</span>
                <span>Resume</span>
            </button>
        </div>
    </div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center px-4 py-12 relative w-full">
    <!-- Abstract Background Glows -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="max-w-3xl w-full flex flex-col gap-8 animate-fade-in">
        <!-- Bot Message Bubble -->
        <div class="flex gap-4 items-end">
            <div class="size-10 rounded-full bg-gradient-to-br from-gray-700 to-gray-900 flex items-center justify-center shrink-0 border border-gray-700 shadow-lg">
                <span class="material-symbols-outlined text-white text-xl">smart_toy</span>
            </div>
            <div class="flex flex-col gap-2 max-w-[80%]">
                <div class="bg-[#233648] text-white p-5 rounded-2xl rounded-bl-sm shadow-md border border-[#2e4559]">
                    <h1 class="text-2xl font-bold leading-tight mb-2">Hello! To get started, tell me a bit about you.</h1>
                    <p class="text-gray-300 text-base font-normal">Select your role to tailor the experience just for you.</p>
                </div>
            </div>
        </div>
        <!-- Typing Indicator (Decoration) -->
        <div class="flex gap-4 items-end opacity-60">
            <div class="size-10 shrink-0"></div> <!-- Spacer -->
            <div class="bg-[#233648]/50 p-3 rounded-2xl rounded-bl-sm w-16 flex items-center justify-center gap-1">
                <div class="size-2 bg-gray-400 rounded-full typing-dot"></div>
                <div class="size-2 bg-gray-400 rounded-full typing-dot"></div>
                <div class="size-2 bg-gray-400 rounded-full typing-dot"></div>
            </div>
        </div>
        <!-- User Response Options Area -->
        <div class="flex justify-end w-full mt-4">
            <div class="flex flex-col items-end gap-4 w-full md:w-auto">
                <p class="text-sm text-gray-400 font-medium tracking-wide uppercase pr-2">Choose your path</p>
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <!-- Option 1: Recruiter -->
                    <button class="group relative flex items-center gap-3 bg-[#1e2936] hover:bg-primary border border-[#2e4559] hover:border-primary/50 text-white px-6 py-4 rounded-full transition-all duration-300 shadow-sm hover:shadow-xl hover:shadow-primary/20 hover:-translate-y-1">
                        <div class="size-8 rounded-full bg-[#2a3b4d] group-hover:bg-white/20 flex items-center justify-center transition-colors">
                            <span class="material-symbols-outlined text-xl group-hover:text-white text-[#92adc9]">work</span>
                        </div>
                        <div class="flex flex-col items-start text-left">
                            <span class="font-bold text-base leading-none mb-1">I'm a Recruiter</span>
                            <span class="text-xs text-gray-400 group-hover:text-white/80 font-normal">Review experience &amp; skills</span>
                        </div>
                    </button>
                    <!-- Option 2: Developer -->
                    <button class="group relative flex items-center gap-3 bg-[#1e2936] hover:bg-primary border border-[#2e4559] hover:border-primary/50 text-white px-6 py-4 rounded-full transition-all duration-300 shadow-sm hover:shadow-xl hover:shadow-primary/20 hover:-translate-y-1">
                        <div class="size-8 rounded-full bg-[#2a3b4d] group-hover:bg-white/20 flex items-center justify-center transition-colors">
                            <span class="material-symbols-outlined text-xl group-hover:text-white text-[#92adc9]">code</span>
                        </div>
                        <div class="flex flex-col items-start text-left">
                            <span class="font-bold text-base leading-none mb-1">I'm a Developer</span>
                            <span class="text-xs text-gray-400 group-hover:text-white/80 font-normal">Check code &amp; stack</span>
                        </div>
                    </button>
                    <!-- Option 3: Friend -->
                    <button class="group relative flex items-center gap-3 bg-[#1e2936] hover:bg-primary border border-[#2e4559] hover:border-primary/50 text-white px-6 py-4 rounded-full transition-all duration-300 shadow-sm hover:shadow-xl hover:shadow-primary/20 hover:-translate-y-1">
                        <div class="size-8 rounded-full bg-[#2a3b4d] group-hover:bg-white/20 flex items-center justify-center transition-colors">
                            <span class="material-symbols-outlined text-xl group-hover:text-white text-[#92adc9]">waving_hand</span>
                        </div>
                        <div class="flex flex-col items-start text-left">
                            <span class="font-bold text-base leading-none mb-1">Just a Friend</span>
                            <span class="text-xs text-gray-400 group-hover:text-white/80 font-normal">Say hello &amp; connect</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- Footer -->
<footer class="w-full border-t border-[#233648] bg-background-light dark:bg-background-dark py-8">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
        <p class="text-[#92adc9] text-sm">© 2024 Portfolio. All rights reserved.</p>
        <div class="flex items-center gap-6">
            <a class="text-[#92adc9] hover:text-primary transition-colors flex items-center justify-center" href="#">
                <span class="material-symbols-outlined text-2xl">code_off</span>
            </a>
            <a class="text-[#92adc9] hover:text-primary transition-colors flex items-center justify-center" href="#">
                <span class="material-symbols-outlined text-2xl">alternate_email</span>
            </a>
            <a class="text-[#92adc9] hover:text-primary transition-colors flex items-center justify-center" href="#">
                <span class="material-symbols-outlined text-2xl">public</span>
            </a>
        </div>
    </div>
</footer>
</body></html>
