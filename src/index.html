<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive portfolio showcasing professional work and skills through a conversational interface">
  <meta name="keywords" content="portfolio, developer, projects, skills, experience">
  <meta name="author" content="Portfolio Owner">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Interactive Portfolio">
  <meta property="og:description" content="Explore my professional journey through an engaging conversational interface">

  <title>Interactive Portfolio of Serhii Hrudakov</title>

  <link rel="stylesheet" href="./styles/styles.scss">
</head>
<body>
  <div id="initial-loader" class="loader-container" role="status" aria-live="polite" aria-label="Loading portfolio">
    <div class="loader-spinner"></div>
    <p class="loader-text">Preparing your experience...</p>
  </div>

  <header class="header" role="banner">
    <div class="header-content">
      <div class="header-left">
        <div class="header-brand">
          <a href="#" class="nav-item" data-section-id="" role="menuitem">
            <span class="header-brand-text">Serhii Hrudakov</span>
          </a>
        </div>

        <button
          id="header-nav-toggle"
          class="header-nav-toggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="header-nav">
          <span class="nav-toggle-icon" aria-hidden="true">☰</span>
        </button>

        <nav class="header-nav" id="header-nav" role="navigation" aria-label="Section navigation">
          <!-- Navigation items will be added dynamically -->
          <div id="nav-indicator" class="nav-indicator"></div>
        </nav>
      </div>

      <div class="header-controls">
        <button
          id="header-role-badge"
          class="header-role-badge"
          aria-label="Change role"
          title="Click to change role"
          style="display: none;">
          <span class="header-role-text" id="header-role-text">View</span>
        </button>

        <button
          id="theme-toggle"
          class="control-button control-button--icon"
          aria-label="Toggle theme"
          aria-pressed="false"
          title="Toggle Theme"
          data-theme="light">
          <span class="control-icon" aria-hidden="true">🌙</span>
        </button>

        <select
          id="language-selector"
          class="control-select"
          aria-label="Select language">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>
    </div>
  </header>

  <main class="main-content" role="main" id="main-content">
    <div class="parallax-background" aria-hidden="true">
      <div class="parallax-blob parallax-blob--1"></div>
      <div class="parallax-blob parallax-blob--2"></div>
      <div class="parallax-blob parallax-blob--3"></div>
      <div class="parallax-blob parallax-blob--4"></div>
      <div class="parallax-blob parallax-blob--5"></div>
      <div class="parallax-blob parallax-blob--6"></div>
      <div class="parallax-blob parallax-blob--7"></div>
    </div>

    <section class="hero">
      <div class="hero-image">
        <img src="./assets/images/hero.full.webp" alt="Serhii Hrudakov photo">
      </div>
      <div class="hero-content">
        <h1 class="hero-title"> Hi, I'm <span class="text-gradient">Serhii</span></h1>
        <h2 class="hero-subtitle">Senior Frontend Engineer</h2>
        <p class="hero-intro">
          I built this site so you can get to know me <br/> in the way that
          matters most - to <span class="text-gradient">You.</span>
        </p>
      </div>
      <button class="hero-start-conversation button" id="start-conversation-btn">
        <span class="hero-start-conversation__text">Start Conversation</span>
        <div class="hero-start-conversation__icon-wrapper">
          <span class="material-symbols-outlined">send</span>
        </div>
      </button>
    </section>

    <div id="typing-indicator" class="typing-indicator" role="status" aria-live="polite" style="display: none;">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-text">Generating content...</span>
    </div>
  </main>

  <template id="section-template">
    <section class="content-section">
      <div class="parallax-layer" aria-hidden="true"></div>

      <div class="section-layout">
        <div class="section-visual">
          <div class="section-visual-container">
            <!-- Image will be inserted here -->
          </div>
        </div>
        <div class="section-body">
          <div class="section-header">
            <h2 class="section-title"></h2>
            <p class="section-query"></p>
          </div>
          <div class="section-body-content">
            <!-- Text content will be inserted here -->
          </div>
        </div>
      </div>
    </section>
  </template>

<!--  TODO: Make template for default section content and then use it with dynamic section elements under 2 different templates-->
  <template id="contact-section-template">
    <section class="content-section content-section--contact">
      <div class="parallax-layer" aria-hidden="true"></div>

      <div class="section-layout">
        <div class="section-visual">
          <div class="section-visual-container">
            <!-- Image will be inserted here -->
          </div>
        </div>
        <div class="section-body">
          <div class="section-header">
            <h2 class="section-title"></h2>
            <p class="section-query"></p>
          </div>
          <div class="section-body-content">
            <!-- Text content will be inserted here -->
          </div>
          <div class="contact-actions">
            <a
              href="mailto:"
              class="contact-link contact-email-link"
              data-email=""
              data-name=""
              aria-label="Send email">
              Send me an email
            </a>
            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="contact-link contact-linkedin-link"
              aria-label="Connect on LinkedIn">
              Connect on LinkedIn
            </a>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="action-prompt-template">
    <div class="action-prompt" role="region" aria-label="Section interaction">
      <button
              class="button prompt-button"
              aria-label="Submit prompt"
              data-default-text="Get to know">
        Next:
      </button>
    </div>
  </template>

  <template id="nav-item-template">
    <a href="#" class="nav-item" data-section-id="" role="menuitem">
      <span class="nav-icon" aria-hidden="true"></span>
      <span class="nav-title"></span>
    </a>
  </template>

  <template id="loader-template">
    <div class="loader" role="status" aria-live="polite">
      <div class="loader-spinner"></div>
    </div>
  </template>

  <template id="generative-image-template">
    <div class="generative-image">
      <img class="generative-image__high-res" src="" alt="" />
      <div class="generative-image__overlay" role="presentation"></div>
      <div class="generative-image__badge">Refining...</div>
    </div>
  </template>

  <template id="personalization-modal-template">
    <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="personalization-title">
      <div class="modal-content modal-content--personalization">
        <h2 id="personalization-title" class="modal-title">Welcome! Let's personalize your experience</h2>

        <div class="personalization-form">
          <div class="form-group">
            <label for="user-name-input" class="label">What's your name?</label>
            <input
              type="text"
              id="user-name-input"
              class="input"
              placeholder="Enter your name"
              maxlength="50"
              required
              aria-required="true">
          </div>

          <div class="form-group">
            <p class="label">I'm a...</p>
            <div class="role-buttons" role="radiogroup" aria-label="Select your role">
              <button
                class="role-button"
                data-role="recruiter"
                role="radio"
                aria-checked="false">
                <span class="role-icon" aria-hidden="true">💼</span>
                <span class="role-label">Recruiter</span>
              </button>
              <button
                class="role-button"
                data-role="developer"
                role="radio"
                aria-checked="false">
                <span class="role-icon" aria-hidden="true">💻</span>
                <span class="role-label">Developer</span>
              </button>
              <button
                class="role-button"
                data-role="friend"
                role="radio"
                aria-checked="false">
                <span class="role-icon" aria-hidden="true">👋</span>
                <span class="role-label">Friend</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="role-change-modal-template">
    <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="role-change-modal-title">
      <div class="modal-content role-change-modal">
        <button class="modal-content-close" aria-label="Close modal">
          <span aria-hidden="true">×</span>
        </button>

        <h3 id="role-change-modal-title" class="role-change-modal-title">Change Your Role</h3>
        <span class="role-change-modal-subtitle">Select a different perspective <br/> to see other sides of my <span class="text-gradient">portfolio</span></span>

        <div class="role-change-modal-selection-grid">
          <button class="button button--recruiter" data-role="recruiter">
            <span class="button__description">
              I'll focus on reliability, estimations, and delivery experience
            </span>
            <span class="button__title">Recruiter</span>
          </button>

          <button class="button button--developer" data-role="developer">
            <span class="button__description">
              I'll dive into the tech stack, architecture, and tools I used in my projects.
            </span>
            <span class="button__title">Engineer</span>
          </button>

          <button class="button button--friend" data-role="friend">
            <span class="button__description">
              I'll introduce the human side of my self so you can understand what kind of person I am.
            </span>
            <span class="button__title">Friend</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Chat Section Templates -->
  <template id="chat-message-template">
    <div class="chat-message">
      <div class="chat-message__avatar" data-avatar-url=""></div>
      <div class="chat-message__content">
        <span class="chat-message__sender"></span>
        <div class="chat-message__bubble">
          <p class="chat-message__text"></p>
        </div>
      </div>
    </div>
  </template>

  <template id="chat-divider-template">
    <div class="chat-divider">
      <span class="chat-divider__text"></span>
    </div>
  </template>

  <template id="chat-context-badge-template">
    <div class="chat-context-badge">
      <div class="chat-context-badge__container">
        <span class="chat-context-badge__icon">👁</span>
        <p class="chat-context-badge__text">
          Viewing as: <strong></strong>
        </p>
      </div>
    </div>
  </template>

  <template id="chat-typing-template">
    <div class="chat-typing">
      <div class="chat-typing__avatar" data-avatar-url=""></div>
      <div class="chat-typing__bubble">
        <div class="chat-typing__dot"></div>
        <div class="chat-typing__dot"></div>
        <div class="chat-typing__dot"></div>
      </div>
    </div>
  </template>

  <template id="chat-about-section-template">
    <section class="content-section chat-section" data-section-id="about">
      <div class="chat-about-header">
        <div class="chat-about-header__badge">
          <span class="chat-about-header__badge-icon">👤</span>
          <span>Profile Context: <span class="role-label"></span></span>
        </div>
        <h1 class="chat-about-header__title">About Me</h1>
        <p class="chat-about-header__subtitle">Getting to know the person behind the code.</p>
      </div>
      <div class="chat-messages-container">
        <!-- Messages will be inserted here -->
      </div>
      <div class="chat-actions">
        <p class="chat-actions__label">Suggested Replies</p>
        <div class="chat-actions__buttons">
          <!-- Action buttons will be inserted here -->
        </div>
      </div>
    </section>
  </template>

  <template id="chat-experience-section-template">
    <section class="content-section chat-section" data-section-id="experience">
      <div class="chat-messages-container">
        <!-- Messages will be inserted here -->
      </div>
    </section>
  </template>

  <template id="chat-experience-item-template">
    <div class="chat-experience__card">
      <div class="chat-experience__header">
        <div class="chat-experience__title-group">
          <h3 class="chat-experience__role"></h3>
          <p class="chat-experience__company"></p>
        </div>
        <span class="chat-experience__period"></span>
      </div>
      <p class="chat-experience__description"></p>
      <div class="chat-experience__visual" style="display: none;">
        <img class="chat-experience__visual-image" src="" alt="">
        <div class="chat-experience__visual-caption">
          <div class="chat-experience__visual-caption-icon">📊</div>
          <span class="chat-experience__visual-caption-text"></span>
        </div>
      </div>
      <div class="chat-experience__tech-stack">
        <!-- Tech tags will be inserted here -->
      </div>
    </div>
  </template>

  <template id="chat-projects-section-template">
    <section class="content-section chat-section" data-section-id="projects">
      <div class="chat-messages-container">
        <!-- Messages will be inserted here -->
      </div>
    </section>
  </template>

  <template id="chat-project-card-template">
    <div class="chat-projects__card">
      <div class="chat-projects__image-section">
        <img class="chat-projects__image-section-img" src="" alt="">
        <div class="chat-projects__image-section-tech-overlay">
          <!-- Tech badges will be inserted here (mobile only) -->
        </div>
      </div>
      <div class="chat-projects__content-section">
        <div class="chat-projects__header">
          <div class="chat-projects__title-group">
            <h3 class="chat-projects__title"></h3>
            <p class="chat-projects__category"></p>
          </div>
          <div class="chat-projects__icon">🚀</div>
        </div>
        <p class="chat-projects__description"></p>
        <div class="chat-projects__tech-stack">
          <!-- Tech chips will be inserted here -->
        </div>
        <div class="chat-projects__actions">
          <button class="chat-projects__action-button chat-projects__action-button--primary">
            <span class="chat-projects__action-button-icon">🚀</span>
            Live Demo
          </button>
          <button class="chat-projects__action-button chat-projects__action-button--secondary">
            <span class="chat-projects__action-button-icon">💻</span>
            View Code
          </button>
        </div>
      </div>
    </div>
  </template>

  <template id="chat-skills-section-template">
    <section class="content-section chat-section" data-section-id="skills">
      <div class="chat-messages-container">
        <!-- Messages will be inserted here -->
      </div>
    </section>
  </template>

  <template id="chat-skill-group-template">
    <div class="chat-skills__group">
      <div class="chat-skills__header">
        <span class="chat-skills__header-icon">💻</span>
        <h3 class="chat-skills__header-title"></h3>
      </div>
      <div class="chat-skills__content">
        <!-- Skill items will be inserted here based on type -->
      </div>
    </div>
  </template>

  <template id="chat-skill-progress-template">
    <div class="chat-skills__skill-item">
      <div class="chat-skills__skill-header">
        <span class="chat-skills__skill-name"></span>
        <span class="chat-skills__skill-header-level"></span>
      </div>
      <div class="chat-skills__progress-bar">
        <div class="chat-skills__progress-fill"></div>
      </div>
    </div>
  </template>

  <template id="chat-action-buttons-template">
    <div class="chat-actions">
      <p class="chat-actions__label">Quick Reply</p>
      <div class="chat-actions__buttons">
        <!-- Buttons will be inserted dynamically -->
      </div>
    </div>
  </template>

  <template id="path-selection-template">
    <section class="path-selection" id="path-selection">
      <p class="path-selection-description">
        Hiring the right person shouldn't mean drowning in hundreds of CVs.
        Even with AI's help, you still need to know what you're looking for.
        I wanted to solve that problem - by letting you choose your own path.
      </p>

      <div class="path-selection-cards">
        <article class="path-card">
          <h3>For Recruiters</h3>
          <p>
            Find my experience, skills, and career highlights - everything you need to evaluate fit, fast.
          </p>
          <button class="button button--recruiter" data-role="recruiter">
            <span class="button__description" data-role="recruiter-description">
              Experience, roles and skills I got through my career path.
            </span>
            <span class="button__title">View as Recruiter</span>
          </button>
        </article>

        <article class="path-card">
          <h3>For Engineers</h3>
          <p>
            Explore the technologies I love, the projects I'm proud of, and what makes me tick as a builder.
          </p>
          <button class="button button--developer" data-role="developer">
            <span class="button__description" data-role="developer-description">
              Projects, technologies and visions I got through my builder path.
            </span>
            <span class="button__title">View as Engineer</span>
          </button>
        </article>

        <article class="path-card">
          <h3>For Friends</h3>
          <p>
            I'll introduce the human side of my self so you can understand what kind of person I am.
          </p>
          <button class="button button--friend" data-role="friend">
            <span class="button__description" data-role="friend-description">
              For friends and thous who want to become one
            </span>
            <span class="button__title">View as Friend</span>
          </button>
        </article>
      </div>

      <p class="path-selection-cta--prompt">Which path speaks to you?</p>
    </section>
  </template>

  <script type="module" src="./scripts/modules/app-controller/index.js"></script>
</body>
</html>
